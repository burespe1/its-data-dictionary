name: Build

# Builds the website and deploys it to GitHub Pages:
#   /        latest release (newest tag itsdd-vX.Y.Z); if there is none yet, a pointer to the draft
#   /draft/  current state of main, with a draft banner on every page
# Pull requests only check and build, nothing is deployed.
# release.yml starts this workflow again after each new release.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # all tags, to find the latest release
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Check term files
        run: python scripts/build.py --check

      - name: Latest release (site root)
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p _out
          TAG=$(git tag -l 'itsdd-v*' --sort=-v:refname | head -n1)
          if [ -n "$TAG" ]; then
            echo "Latest release: $TAG"
            git worktree add -q _rel "$TAG"
            cd _rel
            ITSDD_VERSION="${TAG#itsdd-v}" python scripts/build.py
            mkdocs build --strict -f mkdocs.gen.yml -d ../_out
          else
            echo "No release yet, the site root points to the draft."
            printf '%s\n' '<!doctype html><meta charset="utf-8">' \
              '<meta http-equiv="refresh" content="0; url=draft/">' \
              '<title>NAPCORE ITS Data Dictionary</title>' \
              '<p>No release yet. See the <a href="draft/">draft</a>.</p>' > _out/index.html
          fi

      - name: Draft (current main)
        run: |
          ITSDD_VERSION=draft python scripts/build.py
          mkdocs build --strict -f mkdocs.gen.yml -d _out/draft

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _out

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
